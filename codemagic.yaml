# Codemagic build configuration — manual-trigger only (no `triggering:`
# section; nothing builds on push). Ported 1:1 from the proven Everytool
# testflight lane: same keychain script, patch-signing, .ipa build-number
# verify, and altool upload gated on the literal "UPLOAD SUCCEEDED".
# Signing values live in the account-side `signing` variable group.
workflows:
  testflight:
    name: iOS — Build & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      node: 20
      # All signing/upload values come from the account-side `signing`
      # environment variable group — see CODEMAGIC-SETUP.md for the
      # inventory and where each value lives today. Nothing secret is
      # stored in this file.
      groups:
        - signing
      vars:
        EXPO_NO_TELEMETRY: "1"
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          npm ci
      - name: Install signing certificate & provisioning profiles
        script: |
          set -euo pipefail
          TMP_DIR="$CM_BUILD_DIR/build/tmp"
          mkdir -p "$TMP_DIR"

          # --- Temporary keychain with the distribution certificate ---
          CERT_PATH="$TMP_DIR/cert.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          KEYCHAIN_PATH="$TMP_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Code signing identities in build keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # --- Provisioning profiles, installed under their UUIDs ---
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local var_name="$1"
            local raw="$TMP_DIR/$var_name.mobileprovision"
            echo "${!var_name}" | base64 --decode > "$raw"
            local plist="$TMP_DIR/$var_name.plist"
            security cms -D -i "$raw" > "$plist"
            local uuid name
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
            cp "$raw" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "Installed profile: $name ($uuid)"
          }

          install_profile PROFILE_APP_B64
      - name: Show Xcode version (pinned in environment above)
        script: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - name: Prebuild iOS project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/app"
          npx expo prebuild --platform ios --clean
      - name: Patch signing settings (manual)
        script: |
          set -euo pipefail
          # One shared CFBundleVersion for app + extensions, offset so
          # Codemagic's per-app counter (which starts at 1) can never
          # collide with a version App Store Connect already accepted
          # from the GitHub lane. patch-signing.rb aborts loudly if
          # BUILD_NUMBER is unset — keep that guard fed.
          EFFECTIVE_BUILD_NUMBER=$((BUILD_NUMBER + 1000))
          echo "EFFECTIVE_BUILD_NUMBER=$EFFECTIVE_BUILD_NUMBER" >> "$CM_ENV"
          echo "Build number for this run: $EFFECTIVE_BUILD_NUMBER (Codemagic $BUILD_NUMBER + 1000)"
          if ! ruby -e "require 'xcodeproj'" 2>/dev/null; then
            echo "xcodeproj gem missing — installing"
            sudo gem install xcodeproj --no-document
          fi
          cd "$CM_BUILD_DIR/app"
          BUILD_NUMBER="$EFFECTIVE_BUILD_NUMBER" ruby scripts/patch-signing.rb
      - name: Archive
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/app"
          TMP_DIR="$CM_BUILD_DIR/build/tmp"
          mkdir -p "$TMP_DIR"
          if ! xcodebuild archive \
            -workspace ios/Gaso.xcworkspace \
            -scheme Gaso \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$TMP_DIR/Gaso.xcarchive" \
            CURRENT_PROJECT_VERSION=$EFFECTIVE_BUILD_NUMBER \
            > "$TMP_DIR/archive.log" 2>&1; then
            echo "::error::xcodebuild archive FAILED — diagnostics from archive.log:"
            mkdir -p "$CM_BUILD_DIR/build/logs" && cp "$TMP_DIR/archive.log" "$CM_BUILD_DIR/build/logs/" || true
            echo "----- all error: lines -----"
            grep -n -E "error:|fatal error" "$TMP_DIR/archive.log" | head -100 || true
            FIRST="$(grep -n -m1 -E "error:" "$TMP_DIR/archive.log" | cut -d: -f1 || true)"
            if [ -n "${FIRST:-}" ]; then
              START=$(( FIRST > 30 ? FIRST - 30 : 1 ))
              echo "----- context around first error (lines $START..$((FIRST + 80))) -----"
              sed -n "${START},$((FIRST + 80))p" "$TMP_DIR/archive.log"
            fi
            echo "----- failed build commands summary -----"
            grep -n -A8 "The following build commands failed" "$TMP_DIR/archive.log" || true
            echo "----- last 40 lines -----"
            tail -40 "$TMP_DIR/archive.log"
            exit 1
          fi
          echo "Archive succeeded:"
          grep -E "ARCHIVE SUCCEEDED" "$TMP_DIR/archive.log" || true
          ls -la "$TMP_DIR/Gaso.xcarchive"
      - name: Export .ipa
        script: |
          set -uo pipefail
          cd "$CM_BUILD_DIR/app"
          TMP_DIR="$CM_BUILD_DIR/build/tmp"
          mkdir -p build/export
          if ! xcodebuild -exportArchive \
            -archivePath "$TMP_DIR/Gaso.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist scripts/ExportOptions.plist \
            > "$TMP_DIR/export.log" 2>&1; then
            echo "::error::xcodebuild -exportArchive FAILED — export.log:"
            mkdir -p "$CM_BUILD_DIR/build/logs" && cp "$TMP_DIR/export.log" "$CM_BUILD_DIR/build/logs/" || true
            grep -n -E "error:" "$TMP_DIR/export.log" | head -50 || true
            tail -150 "$TMP_DIR/export.log"
            exit 1
          fi
          echo "Export succeeded:"
          grep -E "EXPORT SUCCEEDED" "$TMP_DIR/export.log" || true
          ls -lh "$CM_BUILD_DIR/build/export"
          IPA_PATH="$(ls "$CM_BUILD_DIR/build/export"/*.ipa | head -1)"
          echo "IPA_PATH=$IPA_PATH" >> "$CM_ENV"
          echo "Exported IPA: $IPA_PATH"
      - name: Verify .ipa build number
        script: |
          set -euo pipefail
          TMP_DIR="$CM_BUILD_DIR/build/tmp"
          mkdir -p "$TMP_DIR"
          # Guard: app + every extension must carry THIS run's number.
          # A GitHub run shipped app=1 / extensions=9 and App Store
          # Connect rejected the upload as a duplicate version — under a
          # green checkmark. Fail here instead, before any upload.
          APP_PLIST_PATH="$(unzip -Z1 "$IPA_PATH" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -1)"
          unzip -p "$IPA_PATH" "$APP_PLIST_PATH" > "$TMP_DIR/app-Info.plist"
          APP_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TMP_DIR/app-Info.plist")"
          echo "App CFBundleVersion in .ipa: $APP_VER (expected $EFFECTIVE_BUILD_NUMBER)"
          if [ "$APP_VER" != "$EFFECTIVE_BUILD_NUMBER" ]; then
            echo "::error::App CFBundleVersion $APP_VER != build number $EFFECTIVE_BUILD_NUMBER — App Store Connect would reject this as a duplicate version."
            exit 1
          fi
          for appex in $(unzip -Z1 "$IPA_PATH" | grep -E 'Payload/[^/]+\.app/(PlugIns/[^/]+\.appex|Watch/[^/]+\.app|Watch/[^/]+\.app/PlugIns/[^/]+\.appex)/Info\.plist$' || true); do
            unzip -p "$IPA_PATH" "$appex" > "$TMP_DIR/appex-Info.plist"
            V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TMP_DIR/appex-Info.plist")"
            echo "$appex CFBundleVersion: $V"
            if [ "$V" != "$EFFECTIVE_BUILD_NUMBER" ]; then
              echo "::error::Extension $appex CFBundleVersion $V != build number $EFFECTIVE_BUILD_NUMBER (ITMS-90473)"
              exit 1
            fi
          done
      - name: Upload to App Store Connect (TestFlight)
        script: |
          set -euo pipefail
          # The GitHub lane gates this step on the ASC_ISSUER_ID secret
          # being set (and prints a skip notice otherwise). Codemagic
          # steps have no `if:`, so the same gate lives here: with no
          # issuer id the build still succeeds and the .ipa is in the
          # artifacts — only the upload is skipped.
          if [ -z "${ASC_ISSUER_ID:-}" ]; then
            echo "::notice::ASC_ISSUER_ID is not set in the signing group — skipping the App Store Connect upload. The .ipa was built and is available in this build's artifacts."
            exit 0
          fi
          TMP_DIR="$CM_BUILD_DIR/build/tmp"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$TMP_DIR/altool.log"
          # altool can exit 0 even when App Store Connect rejects the
          # upload (HTTP 409 duplicate CFBundleVersion under a green
          # step). Its output text is the only verdict.
          if ! grep -q "UPLOAD SUCCEEDED" "$TMP_DIR/altool.log"; then
            echo "::error::altool did not report UPLOAD SUCCEEDED — treating this upload as FAILED (see its output above)."
            exit 1
          fi
    artifacts:
      # Mirrors the GitHub "Upload .ipa artifact" step (success path)
      # and "Upload build logs (on failure)"; Codemagic collects these
      # when the build ends, success or failure. The GitHub lane's
      # "Delete signing keychain (always)" step has no equivalent here:
      # Codemagic build VMs are ephemeral and destroyed after the build,
      # keychain included.
      - build/export/*.ipa
      - build/logs/**/*
